name: Flask App CI/CD

on:
  push:
    branches:
      - master  # Trigger on pushes to the master branch
  pull_request:
    branches:
      - master  # Trigger on pull requests targeting the master branch

jobs:
  # Job 1: Set up Python and Install Dependencies
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.9

    - name: Install dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install -r app/requirements.txt

    - name: Run tests (if any)
      run: |
        # Example: run tests if you have some
        # python -m unittest discover
        echo "No tests yet"

  # Job 2: Build Docker image and push to Docker Hub
  docker-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    # Debugging step to list files in the app directory
    - name: List files in app folder
      run: ls -R ./app

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build -t flask-todo -f ./app/Dockerfile ./app

    - name: Tag Docker image
      run: |
        docker tag flask-todo ${{ secrets.DOCKER_USERNAME }}/flask-todo:latest

    - name: Push Docker image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/flask-todo:latest
