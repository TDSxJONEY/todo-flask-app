name: Flask App CI/CD

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch
  pull_request:
    branches:
      - main  # Trigger on pull requests targeting the main branch

jobs:
  # Job 1: Set up Python and Install Dependencies
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.9

    - name: Install dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install -r app/requirements.txt

    - name: Run tests (if any)
      run: |
        # Example: run tests if you have some
        # python -m unittest discover
        echo "No tests yet"
  
  # Job 2: Build Docker image and push to Docker Hub
  docker-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build -t flask-todo .

    - name: Push Docker image
      run: |
        docker tag flask-todo your-docker-username/flask-todo:latest
        docker push your-docker-username/flask-todo:latest
